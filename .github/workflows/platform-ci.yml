name: platform-ci

on:
  push:
    branches: [main]
    paths: ['platform/**', '.github/workflows/platform-ci.yml']
  pull_request:
    paths: ['platform/**', '.github/workflows/platform-ci.yml']

defaults:
  run:
    working-directory: platform

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: truvia
          POSTGRES_PASSWORD: truvia
          POSTGRES_DB: truvia
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U truvia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ADMIN_DATABASE_URL: postgres://truvia:truvia@localhost:5432/truvia
      DATABASE_URL: postgres://truvia_app:truvia@localhost:5432/truvia
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
        working-directory: platform/infra/terraform
      - run: terraform init -backend=false
        working-directory: platform/infra/terraform
      - run: terraform validate
        working-directory: platform/infra/terraform
