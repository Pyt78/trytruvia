# Local Postgres for development and the test suite. The password is a local
# development value only and is never used outside a developer machine or CI.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: truvia
      POSTGRES_PASSWORD: truvia
      POSTGRES_DB: truvia
    ports:
      - '5432:5432'
    volumes:
      - truvia-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U truvia']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  truvia-pg:
